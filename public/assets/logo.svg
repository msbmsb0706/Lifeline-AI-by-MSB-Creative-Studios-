<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#182030" />
      <stop offset="60%" stop-color="#0c111a" />
      <stop offset="100%" stop-color="#05080e" />
    </radialGradient>

    <!-- Crimson Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b47" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Pulse Line Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Strong Outer Glow -->
    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Badge Container -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="#233047" stroke-width="6" />
  
  <!-- Subtle Internal Ring -->
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="#ef4444" stroke-opacity="0.25" stroke-width="2" />

  <!-- Shield Base with Glow -->
  <g transform="translate(256, 175) scale(1.15)">
    <!-- Shield Shadow / Ambient Red Aura -->
    <path d="M 0 -75 L 55 -48 C 55 25 32 75 0 98 C -32 75 -55 25 -55 -48 Z" fill="#ef4444" opacity="0.3" filter="url(#outerGlow)" />
    
    <!-- Solid Shield -->
    <path d="M 0 -72 L 52 -46 C 52 23 30 70 0 92 C -30 70 -52 23 -52 -46 Z" fill="url(#shieldGrad)" stroke="#fca5a5" stroke-width="3" />

    <!-- Medical Cross Emboss in Shield -->
    <rect x="-10" y="-38" width="20" height="76" rx="4" fill="#ffffff" fill-opacity="0.18" />
    <rect x="-38" y="-10" width="76" height="20" rx="4" fill="#ffffff" fill-opacity="0.18" />

    <!-- Dynamic Glowing Lifeline (ECG / Pulse Waveform) -->
    <path d="M -75 0 L -36 0 L -22 -32 L -6 42 L 8 -46 L 22 24 L 34 -6 L 46 0 L 75 0" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)" />
    
    <!-- Heartbeat nodes -->
    <circle cx="-6" cy="42" r="3.5" fill="#ffffff" />
    <circle cx="8" cy="-46" r="3.5" fill="#ffffff" />
  </g>

  <!-- App Title: "LifeLine AI" -->
  <text x="256" y="365" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="-0.5" 
        fill="#ffffff">
    LifeLine <tspan fill="#ef4444">AI</tspan>
  </text>

  <!-- Studio Subtitle: "BY MSB CREATIVE STUDIOS" -->
  <text x="256" y="415" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="15" 
        font-weight="800" 
        letter-spacing="5" 
        fill="#94a3b8">
    BY MSB CREATIVE STUDIOS
  </text>

  <!-- Emergency Badge Indicator -->
  <g transform="translate(256, 448)">
    <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#220e12" stroke="#7f1d1d" stroke-width="1.5" />
    <circle cx="-46" cy="0" r="4" fill="#ef4444" />
    <text x="-34" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="2" fill="#fca5a5">EMERGENCY</text>
  </g>
</svg>
